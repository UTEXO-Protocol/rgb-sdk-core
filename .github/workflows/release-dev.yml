name: Release (dev)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Base version (e.g., 0.2.0-beta.1)"
        required: true
        type: string
      suffix:
        description: "Dev suffix (e.g., test1 → published as 0.2.0-beta.1.test1)"
        required: true
        type: string

jobs:
  build:
    name: Build & Publish (dev)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get full version
        id: version
        run: |
          RAW="${{ inputs.version }}"
          BASE="${RAW#v}"
          SUFFIX="$(echo '${{ inputs.suffix }}' | tr '-' '.')"
          if [[ "$BASE" == *-* ]]; then
            FULL_VERSION="${BASE}.${SUFFIX}"
          else
            FULL_VERSION="${BASE}-${SUFFIX}"
          fi
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "Version: $FULL_VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Set package version
        run: npm version ${{ steps.version.outputs.full_version }} --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run build

      - name: Publish to npm with dev tag
        run: npm publish --access public --tag ${{ inputs.suffix }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get full version
        id: version
        run: |
          RAW="${{ inputs.version }}"
          BASE="${RAW#v}"
          SUFFIX="$(echo '${{ inputs.suffix }}' | tr '-' '.')"
          if [[ "$BASE" == *-* ]]; then
            FULL_VERSION="${BASE}.${SUFFIX}"
          else
            FULL_VERSION="${BASE}-${SUFFIX}"
          fi
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$FULL_VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }} (dev)
          body: |
            ## @utexo/rgb-sdk-core ${{ steps.version.outputs.tag }} (dev build)
            
            Branch: `${{ github.ref_name }}`
            
            ### Installation
            
            ```bash
            npm install @utexo/rgb-sdk-core@${{ steps.version.outputs.full_version }}
            ```
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
